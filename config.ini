; Конфигурация путей и окружения инженерной панели MyNewAttemp
[environment]
; false для XAMPP/Windows, true при переносе на боевой Linux/Nginx
IS_PRODUCTION = false

[paths]
; Абсолютный путь к корню проекта. 
; Если оставить пустой или ".", система вычислит корень автоматически (динамически)
ROOT_PATH = ""

[logging]
; Путь к файлу сквозного отладочного лога
DEBUG_LOG_FILE = "data/server/system/debug_import.log"