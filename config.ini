; ===================================================================
; ГЛОВБАЛЬНАЯ КОНФИГУРАЦИЯ СИСТЕМЫ С КЛАДА (MyNewAttemp)
; ===================================================================

[environment]
; Флаг продакшена. На локальном XAMPP всегда держим false.
; При переносе на хостинг переключим в true, чтобы скрыть отладочные логи.
IS_PRODUCTION = false

[system]
; Режим отладки бэкенда (1 - включен, 0 - выключен)
debug_mode = 1
; Часовой пояс для системного логгера и фиксации времени заказов
timezone = "Europe/Moscow"

[paths]
; Оставляем этот параметр пустым для локальной разработки на XAMPP.
; Наше умное ядро PHP автоматически вычислит абсолютный путь к папке.
; При переносе на хостинг впишем сюда Linux-путь, выданный провайдером.
ROOT_PATH = ""
